
services:
  postgres:
    image: postgres:15
    container_name: shop_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shop

    # Database access restricted to this computer.
    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - biztru_network

  migrate:
    image: biztru-backend:testing
    container_name: biztru_migrations
    restart: "no"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production

    command:
      - npm
      - run
      - prisma:deploy
      - --workspace=shop-backend

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - biztru_network

  backend:
    build:
      context: .
      dockerfile: shop-backend/Dockerfile

    image: biztru-backend:testing
    container_name: biztru_backend
    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 5000

    ports:
      - "5000:5000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:
      - biztru_network

  frontend:
    build:
      context: .
      dockerfile: biztru-react/Dockerfile

    image: biztru-frontend:testing
    container_name: biztru_frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_started

    networks:
      - biztru_network
volumes:
  postgres_data:

networks:
  biztru_network:
    driver: bridge
